name: Build Clash rules

on:
  push:
    branches: [ main ]
    paths:
      - "rules.json"

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Convert
        run: python scripts/convert_rules.py

      - name: Install sing-box
        run: |
          VER=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name | sed 's/^v//')
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz" | tar xz --strip-components=1 -C /usr/local/bin "sing-box-${VER}-linux-amd64/sing-box"

      - name: Compile SRS
        run: |
          for f in generated/*.json; do
            sing-box rule-set compile "$f" -o "${f%.json}.srs"
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          git diff --cached --quiet || git commit -m "update rules"
          git push
